[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "flux-engine"
version = "0.2.0"
description = "Single-GPU HTTP inference service for FLUX.2 klein 9B"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "Pillow>=11.1,<13",
]

[project.optional-dependencies]
model = [
  "torch>=2.7,<3",
  "diffusers==0.37.1",
  "transformers>=4.57,<5",
  "accelerate>=1.2,<2",
  "safetensors>=0.5,<1",
  "sentencepiece>=0.2,<1",
]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["flux_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
